services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: gitcontext-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  backend:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gitcontext-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - path: .env
        required: false
    environment:
      - QDRANT_URL=http://qdrant:6333
      - GITCONTEXT_QDRANT_URL=http://qdrant:6333
      - REPOS_DIR=/app/data/repos
      - GITCONTEXT_REPOS_DIR=/app/data/repos
      - GITCONTEXT_KEYWORD_INDEX_DIR=/app/data/lucene
    volumes:
      - gitcontext_data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gitcontext-frontend
    restart: unless-stopped
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  gitcontext_data:
