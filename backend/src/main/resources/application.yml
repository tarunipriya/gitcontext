# GitContext Configuration
#
# Environment Variables & Dotenv Loading:
# The spring-dotenv library (springboot4-dotenv) loads key-value pairs from a .env file into the Spring Environment.
# Setting springdotenv.directory: .. directs the library to look one directory up from the backend/ working directory
# to find the .env file at the repository root. Real system environment variables take precedence if defined.

server:
  port: 8081

springdotenv:
  directory: ..

gitcontext:
  github-token: ${GITHUB_TOKEN:}
  repos-dir: ${REPOS_DIR:./data/repos}
  qdrant-url: ${QDRANT_URL:http://localhost:6333}
  llm-api-key: ${LLM_API_KEY:}

